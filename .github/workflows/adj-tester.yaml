name: ADJ Validator

on:
  push:
  pull_request:

jobs:
  validate-adj:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run ADJ validation
        id: adj_validation
        continue-on-error: true
        run: |
          set +e
          python3 .github/workflows/scripts/adj-tester/main.py > output.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Notify Slack on failure
        if: steps.adj_validation.outputs.exit_code != '0'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ERROR_MESSAGE=$(sed 's/"/\\"/g' output.log | tail -n 40)

          payload=$(cat <<EOF
          {
            "text": "<!subteam^S04ABCDE1> ❌ ADJ Validator Failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<!subteam^S04ABCDE1> ❌ *ADJ Validator Failed*"
                }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                  { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                  { "type": "mrkdwn", "text": "*Actor:*\n${{ github.actor }}" }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Last 40 lines of error:*\n\`\`\`${ERROR_MESSAGE}\`\`\`"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Workflow Run"
                    },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -X POST -H "Content-type: application/json" \
            --data "$payload" \
            $SLACK_WEBHOOK

      - name: Fail job if validation failed
        if: steps.adj_validation.outputs.exit_code != '0'
        run: exit 1
