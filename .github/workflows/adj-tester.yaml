name: ADJ Validator

on:
  push:
  pull_request:

jobs:
  validate-adj:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run ADJ validation
        run: |
          python3 .github/workflows/scripts/adj-tester/main.py

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: "<!channel> ❌ ADJ Validator Failed\n\nRepository: \($repo)\nBranch: \($branch)\nActor: \($actor)\n\nWorkflow run:\n\($run_url)"
            }' | curl -X POST -H "Content-type: application/json" \
                 --data @- \
                 $SLACK_WEBHOOK

  publish-compact-adj:
    needs: validate-adj
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: Hyperloop-UPV/ADJ-Archive
      TARGET_BRANCH: main
      TARGET_PATH: commit-${{ github.sha }}.json

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Compact ADJ
        run: |
          chmod +x .github/workflows/scripts/adj-compact/compact.sh
          .github/workflows/scripts/adj-compact/compact.sh "${{ runner.temp }}/adj.json"

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          path: target-repo

      - name: Copy and push if changed
        working-directory: target-repo
        run: |
          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "${{ runner.temp }}/adj.json" "$TARGET_PATH"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH"
          git commit -m "chore: update compacted ADJ from ${{ github.repository }}@${{ github.sha }}"
          git push origin "$TARGET_BRANCH"
