name: ADJ Validator

on:
  push:
  pull_request:

jobs:
  validate-adj:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run ADJ validation
        run: |
          python3 .github/workflows/scripts/adj-tester/main.py > raw_output.log 2>&1

      - name: Clean ANSI colors
        if: failure()
        run: |
          sed -r "s/\x1B\[[0-9;]*[mK]//g" raw_output.log > output.log

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ERROR_MESSAGE=$(tail -n 40 output.log)

          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg error "$ERROR_MESSAGE" \
            '{
              text: "❌ ADJ Validator Failed\n\nRepository: \($repo)\nBranch: \($branch)\nActor: \($actor)\n\nLast 40 lines of error:\n\($error)\n\nWorkflow run:\n\($run_url)"
            }' | curl -X POST -H "Content-type: application/json" \
                 --data @- \
                 $SLACK_WEBHOOK
