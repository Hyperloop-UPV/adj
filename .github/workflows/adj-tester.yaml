name: ADJ Validator

on:
  push:
  pull_request:

jobs:
  validate-adj:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run ADJ validation
        id: adj_validation
        run: |
          set +e
          python3 .github/workflows/scripts/adj-tester/main.py > output.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ERROR_MESSAGE=$(cat output.log | sed 's/"/\\"/g')

          payload=$(cat <<EOF
          {
            "text": "<!subteam^S04ABCDE1> ❌ *ADJ Validator Failed*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<!subteam^S04ABCDE1> ❌ *ADJ Validator Failed*"
                }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                  { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                  { "type": "mrkdwn", "text": "*Actor:*\n${{ github.actor }}" },
                  { "type": "mrkdwn", "text": "*Commit:*\n${{ github.sha }}" }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Error:*\n\`\`\`${ERROR_MESSAGE}\`\`\`"
                }
              }
            ]
          }
          EOF
          )

          curl -X POST -H "Content-type: application/json" \
          --data "$payload" \
          $SLACK_WEBHOOK
